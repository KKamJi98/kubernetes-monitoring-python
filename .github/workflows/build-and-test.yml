name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install uv
        run: pip install uv
      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install .
          uv pip install ".[dev]"
      - name: Run Ruff Format (check)
        run: |
          source .venv/bin/activate
          ruff format --check .
      - name: Run Ruff
        run: |
          source .venv/bin/activate
          ruff check . --fix --exit-non-zero-on-fix
      - name: Run MyPy
        run: |
          source .venv/bin/activate
          mypy .
      - name: Run tests with Pytest and Pytest-Cov
        run: |
          source .venv/bin/activate
          pytest --cov=./ --cov-report=xml

  # release-please runs on a short-lived GitHub App installation token, not the
  # default GITHUB_TOKEN. GitHub holds pull_request runs on a PR that
  # GITHUB_TOKEN opened or updated (action_required, zero jobs) and expires them
  # as failures after 30 days, so the release PR never got CI. Every write here
  # goes through the App token, so GITHUB_TOKEN gets nothing. The token is
  # scoped to this repository (no owner/repositories input) and to the two
  # permissions release-please needs: contents for the release commit, tag and
  # GitHub release, pull-requests for the release PR and its labels.
  #
  # Tags and releases made with the App token do start workflows. Nothing here
  # listens for them today; a `push: tags` or `release` trigger added later will
  # fire on every release.
  #
  # Only pushes to main reach this job. It used to run on every pull request as
  # well, where it did nothing useful. With the App token that would break:
  # Dependabot and fork PRs get no repository secrets, so the token step would
  # fail and turn their CI red, and the release PR's own CI would re-run
  # release-please against itself with a token whose writes start workflows.
  release-please:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: python
